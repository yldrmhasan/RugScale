name: RugScale B163A real-design validation

on:
  push:
    branches: [ main ]
    paths:
      - "src/RugScale.Core/**"
      - "tests/RugScale.Core.Tests/**"
      - "tests/fixtures/rugscale/**"
      - ".github/workflows/rugscale-b163a-validation.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "src/RugScale.Core/**"
      - "tests/RugScale.Core.Tests/**"
      - "tests/fixtures/rugscale/**"
      - ".github/workflows/rugscale-b163a-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-b163a:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ./tests/RugScale.Core.Tests/RugScale.Core.Tests.csproj

      - name: Decode exact B163A fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rugscale" ./artifacts/rugscale-b163a
          cat             ./tests/fixtures/rugscale/b163a.parts/part00.txt             ./tests/fixtures/rugscale/b163a.parts/part01.txt             ./tests/fixtures/rugscale/b163a.parts/part03.txt             ./tests/fixtures/rugscale/b163a.parts/part04.txt             ./tests/fixtures/rugscale/b163a.parts/part05.txt             ./tests/fixtures/rugscale/b163a.parts/part06.txt             ./tests/fixtures/rugscale/b163a.parts/part07.txt             ./tests/fixtures/rugscale/b163a.parts/part08.txt             ./tests/fixtures/rugscale/b163a.parts/part09.txt             | base64 -d             | xz -dc > "$RUNNER_TEMP/rugscale/B163A.bmp"
          echo "9437ea0e9d9615ffd46037516610d53d7fdf37a96835d90aee9fbf90522918da  $RUNNER_TEMP/rugscale/B163A.bmp"             | sha256sum -c -

      - name: Run real-design RugScale validation
        env:
          RUGSCALE_REAL_FIXTURE: "1"
          RUGSCALE_B163A_FIXTURE: ${{ runner.temp }}/rugscale/B163A.bmp
          RUGSCALE_B163A_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/rugscale-b163a
        run: >
          dotnet test ./tests/RugScale.Core.Tests/RugScale.Core.Tests.csproj
          -c Release
          --no-restore
          --filter "Category=RealDesignValidation"
          --logger "console;verbosity=detailed"

      - name: Upload RugScale validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugscale-b163a-validation
          path: ./artifacts/rugscale-b163a
          if-no-files-found: warn
          retention-days: 14
