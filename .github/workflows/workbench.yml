name: RugScale Workbench

on:
  push:
    branches: [ main, "chatgpt/**" ]
    paths:
      - "src/RugScale.Workbench/**"
      - "src/RugScale.Core/**"
      - ".github/workflows/workbench.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "src/RugScale.Workbench/**"
      - "src/RugScale.Core/**"
      - ".github/workflows/workbench.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore .\src\RugScale.Workbench\RugScale.Workbench.csproj
      - name: Build
        run: dotnet build .\src\RugScale.Workbench\RugScale.Workbench.csproj -c Release --no-restore
