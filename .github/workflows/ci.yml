name: RugScale CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/RugScale.Core.Tests/RugScale.Core.Tests.csproj
      - name: Build
        run: dotnet build tests/RugScale.Core.Tests/RugScale.Core.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/RugScale.Core.Tests/RugScale.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
