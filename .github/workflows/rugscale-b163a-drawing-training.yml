name: RugScale B163A drawing self-training

on:
  push:
    branches: [ main ]
    paths:
      - "src/RugScale.Core/Drawing/RugScale/**"
      - "tools/RugScale.RugScaleAudit/**"
      - "tests/fixtures/rugscale/**"
      - ".github/workflows/rugscale-b163a-drawing-training.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "src/RugScale.Core/Drawing/RugScale/**"
      - "tools/RugScale.RugScaleAudit/**"
      - "tests/fixtures/rugscale/**"
      - ".github/workflows/rugscale-b163a-drawing-training.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-drawing:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ./tools/RugScale.RugScaleAudit/RugScale.RugScaleAudit.csproj

      - name: Decode exact B163A fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rugscale"
          cat             ./tests/fixtures/rugscale/b163a.parts/part00.txt             ./tests/fixtures/rugscale/b163a.parts/part01.txt             ./tests/fixtures/rugscale/b163a.parts/part03.txt             ./tests/fixtures/rugscale/b163a.parts/part04.txt             ./tests/fixtures/rugscale/b163a.parts/part05.txt             ./tests/fixtures/rugscale/b163a.parts/part06.txt             ./tests/fixtures/rugscale/b163a.parts/part07.txt             ./tests/fixtures/rugscale/b163a.parts/part08.txt             ./tests/fixtures/rugscale/b163a.parts/part09.txt             | base64 -d             | xz -dc > "$RUNNER_TEMP/rugscale/B163A.bmp"
          echo "9437ea0e9d9615ffd46037516610d53d7fdf37a96835d90aee9fbf90522918da  $RUNNER_TEMP/rugscale/B163A.bmp"             | sha256sum -c -

      - name: Train drawing styles from original source motifs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./artifacts/rugscale-b163a-drawing-training
          dotnet run             --project ./tools/RugScale.RugScaleAudit/RugScale.RugScaleAudit.csproj             -c Release             --no-restore             --             --input "$RUNNER_TEMP/rugscale/B163A.bmp"             --output "$GITHUB_WORKSPACE/artifacts/rugscale-b163a-drawing-training"             --train-drawing

      - name: Publish training summary
        if: always()
        shell: bash
        run: |
          if [ -f ./artifacts/rugscale-b163a-drawing-training/drawing-training.md ]; then
            cat ./artifacts/rugscale-b163a-drawing-training/drawing-training.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Drawing training did not produce drawing-training.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload trained memory and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugscale-b163a-drawing-training
          path: ./artifacts/rugscale-b163a-drawing-training
          if-no-files-found: warn
          retention-days: 14
