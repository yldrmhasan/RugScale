name: RugScale C069 curve training

on:
  pull_request:
    branches: [ main ]
    paths:
      - "src/RugScale.Core/**"
      - "tools/RugScale.CurveScaleAudit/**"
      - "tests/fixtures/rugscale-curves/C069A_CREAM_N69.bmp.xz.b64/**"
      - ".github/workflows/rugscale-c069-curve-training.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c069-curve-training:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'chatgpt/curve-oval-training-2026-09-24'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore focused audit
        run: dotnet restore ./tools/RugScale.CurveScaleAudit/RugScale.CurveScaleAudit.csproj

      - name: Decode C069 training fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rugscale-curves"
          cat ./tests/fixtures/rugscale-curves/C069A_CREAM_N69.bmp.xz.b64/part*.txt | base64 -d > "$RUNNER_TEMP/rugscale-curves/C069A_CREAM_N69.bmp.xz"
          xz -t "$RUNNER_TEMP/rugscale-curves/C069A_CREAM_N69.bmp.xz"
          xz -dc "$RUNNER_TEMP/rugscale-curves/C069A_CREAM_N69.bmp.xz" > "$RUNNER_TEMP/rugscale-curves/C069A_CREAM_N69.bmp"
          echo "d22e56ba9a5d9cf43c8ff0e7dea599246490b6ff394be00dfade39ea5930c456  $RUNNER_TEMP/rugscale-curves/C069A_CREAM_N69.bmp" | sha256sum -c -

      - name: Run focused C069 curve audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./artifacts/rugscale-c069
          dotnet run \
            --project ./tools/RugScale.CurveScaleAudit/RugScale.CurveScaleAudit.csproj \
            -c Release --no-restore -- \
            --input-dir "$RUNNER_TEMP/rugscale-curves" \
            --output "$GITHUB_WORKSPACE/artifacts/rugscale-c069" \
            --fixture C069A_CREAM_N69

      - name: Publish C069 summary
        if: always()
        shell: bash
        run: |
          if [ -f ./artifacts/rugscale-c069/curve-suite-report.md ]; then
            cat ./artifacts/rugscale-c069/curve-suite-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload C069 curve outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugscale-c069-curve-training
          path: ./artifacts/rugscale-c069
          if-no-files-found: warn
          retention-days: 7
