name: RugScale C069 curve training

on:
  pull_request:
    branches: [ main ]
    paths:
      - "src/RugScale.Core/**"
      - "tools/RugScale.CurveScaleAudit/**"
      - "tests/fixtures/rugscale-curves/C069A_CREAM_N69.bmp.xz.b64/**"
      - ".github/workflows/rugscale-c069-curve-training.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c069-curve-training:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'chatgpt/curve-oval-training-2026-09-24'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore focused audit
        run: dotnet restore ./tools/RugScale.CurveScaleAudit/RugScale.CurveScaleAudit.csproj

      - name: Decode C069 training fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rugscale-curves"
          cat ./tests/fixtures/rugscale-curves/C069A_CREAM_N69.bmp.xz.b64/part*.txt | base64 -d > "$RUNNER_TEMP/rugscale-curves/C069A_CREAM_N69.bmp.xz"
          xz -t "$RUNNER_TEMP/rugscale-curves/C069A_CREAM_N69.bmp.xz"
          xz -dc "$RUNNER_TEMP/rugscale-curves/C069A_CREAM_N69.bmp.xz" > "$RUNNER_TEMP/rugscale-curves/C069A_CREAM_N69.bmp"
          echo "d22e56ba9a5d9cf43c8ff0e7dea599246490b6ff394be00dfade39ea5930c456  $RUNNER_TEMP/rugscale-curves/C069A_CREAM_N69.bmp" | sha256sum -c -

      - name: Run focused C069 curve audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./artifacts/rugscale-c069
          dotnet run \
            --project ./tools/RugScale.CurveScaleAudit/RugScale.CurveScaleAudit.csproj \
            -c Release --no-restore -- \
            --input-dir "$RUNNER_TEMP/rugscale-curves" \
            --output "$GITHUB_WORKSPACE/artifacts/rugscale-c069" \
            --fixture C069A_CREAM_N69

      - name: Enforce C069 specialist redraw gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("artifacts/rugscale-c069/C069A_CREAM_N69_ribbon_candidates.csv")
          rows = list(csv.DictReader(path.open(newline="", encoding="utf-8")))
          targets = {
              (99, 219, 148, 298),
              (492, 219, 541, 298),
          }

          found = {}
          for row in rows:
              key = tuple(int(row[name]) for name in ("min_x", "min_y", "max_x", "max_y"))
              if key in targets:
                  found[key] = row

          missing = targets - found.keys()
          if missing:
              raise SystemExit(f"Missing compact spiral audit rows: {sorted(missing)}")

          for key, row in found.items():
              if row["ribbon_shape_reason"] != "ok-compact-spiral":
                  raise SystemExit(f"{key}: unexpected shape reason {row['ribbon_shape_reason']}")
              if row["fit_kind"] != "compact-compound":
                  raise SystemExit(f"{key}: expected compact-compound, got {row['fit_kind']}")
              if row["fit_safe"] != "1" or row["accepted"] != "1":
                  raise SystemExit(f"{key}: compact spiral is no longer production-accepted")
              if int(row["curvature_flips"]) != 0:
                  raise SystemExit(f"{key}: compact spiral gained curvature flips")
              if float(row["max_deviation"]) > 1.90:
                  raise SystemExit(
                      f"{key}: compact spiral source deviation regressed to {row['max_deviation']} px"
                  )

          hook_targets = {
              (99, 212, 139, 239),
              (501, 212, 541, 239),
              (99, 1139, 139, 1166),
              (501, 1139, 541, 1166),
          }
          hooks = {}
          for row in rows:
              key = tuple(int(row[name]) for name in ("min_x", "min_y", "max_x", "max_y"))
              if key in hook_targets:
                  hooks[key] = row

          missing_hooks = hook_targets - hooks.keys()
          if missing_hooks:
              raise SystemExit(f"Missing tapered-hook audit rows: {sorted(missing_hooks)}")

          for key, row in hooks.items():
              if row["ribbon_shape_reason"] != "ok-tapered-hook":
                  raise SystemExit(f"{key}: unexpected tapered-hook reason {row['ribbon_shape_reason']}")
              if row["fit_kind"] != "tapered-hook-compound":
                  raise SystemExit(f"{key}: expected tapered-hook-compound, got {row['fit_kind']}")
              if row["curve_family"] != "CompoundSpline":
                  raise SystemExit(f"{key}: tapered-hook family changed to {row['curve_family']}")
              if row["fit_safe"] != "1" or row["accepted"] != "1":
                  raise SystemExit(f"{key}: tapered hook is no longer production-accepted")
              if int(row["curvature_flips"]) > 1:
                  raise SystemExit(f"{key}: tapered hook gained too many curvature flips")
              if float(row["max_deviation"]) > 1.15:
                  raise SystemExit(
                      f"{key}: tapered-hook source deviation regressed to {row['max_deviation']} px"
                  )
              if float(row["selected_smoothness"]) > 0.095:
                  raise SystemExit(
                      f"{key}: tapered-hook roughness regressed to {row['selected_smoothness']}"
                  )

          layered_s_targets = {
              (105, 566, 156, 812): "negative",
              (484, 566, 535, 812): "positive",
          }
          layered_s = {}
          for row in rows:
              key = tuple(int(row[name]) for name in ("min_x", "min_y", "max_x", "max_y"))
              if key in layered_s_targets:
                  layered_s[key] = row

          missing_layered_s = layered_s_targets.keys() - layered_s.keys()
          if missing_layered_s:
              raise SystemExit(
                  f"Missing layered S-sweep audit rows: {sorted(missing_layered_s)}"
              )

          for key, expected_side in layered_s_targets.items():
              row = layered_s[key]
              if row["layered_ribbon_detected"] != "1":
                  raise SystemExit(f"{key}: layered S-sweep detection was lost")
              if row["layered_ribbon_side"] != expected_side:
                  raise SystemExit(
                      f"{key}: layered side changed to {row['layered_ribbon_side']}, "
                      f"expected {expected_side}"
                  )
              if not row["layered_ribbon_sequence"].startswith("1>4>1"):
                  raise SystemExit(
                      f"{key}: layered sequence changed to {row['layered_ribbon_sequence']}"
                  )
              if float(row["layered_ribbon_bracketed_coverage"]) < 0.85:
                  raise SystemExit(
                      f"{key}: bracketed layered coverage regressed to "
                      f"{row['layered_ribbon_bracketed_coverage']}"
                  )
              if row["fit_safe"] != "1" or row["accepted"] != "1":
                  raise SystemExit(f"{key}: layered S centreline is no longer accepted/safe")
              if row["curve_family"] != "CompoundSpline":
                  raise SystemExit(
                      f"{key}: layered S family changed to {row['curve_family']}"
                  )
              if int(row["curvature_flips"]) != 2:
                  raise SystemExit(
                      f"{key}: expected two real S inflections, got {row['curvature_flips']}"
                  )
              if float(row["max_deviation"]) > 3.30:
                  raise SystemExit(
                      f"{key}: layered S source deviation regressed to "
                      f"{row['max_deviation']} px"
                  )

              widths = [
                  float(value)
                  for value in row["layered_ribbon_mean_widths"].split("|")
                  if value
              ]
              if len(widths) < 3:
                  raise SystemExit(f"{key}: layered S no longer exposes 3 source bands")
              inner, band, outer = widths[:3]
              if not (0.65 <= inner <= 1.65):
                  raise SystemExit(f"{key}: inner separator width regressed to {inner}")
              if not (1.75 <= band <= 8.0):
                  raise SystemExit(f"{key}: middle band width regressed to {band}")
              if not (0.65 <= outer <= 1.65):
                  raise SystemExit(f"{key}: outer separator width regressed to {outer}")

          variable_width_targets = {
              (83, 128, 178, 331),
              (462, 128, 557, 331),
              (83, 1047, 178, 1250),
              (462, 1047, 557, 1250),
          }
          variable_width = {}
          for row in rows:
              key = tuple(int(row[name]) for name in ("min_x", "min_y", "max_x", "max_y"))
              if key in variable_width_targets:
                  variable_width[key] = row

          missing_variable_width = variable_width_targets - variable_width.keys()
          if missing_variable_width:
              raise SystemExit(
                  f"Missing variable-width sweep audit rows: {sorted(missing_variable_width)}"
              )

          for key, row in variable_width.items():
              if row["ribbon_shape_reason"] != "ok-variable-width-sweep":
                  raise SystemExit(
                      f"{key}: unexpected variable-width reason {row['ribbon_shape_reason']}"
                  )
              if row["fit_kind"] != "variable-width-through":
                  raise SystemExit(
                      f"{key}: expected variable-width-through, got {row['fit_kind']}"
                  )
              if row["curve_family"] != "SplineThroughPoints":
                  raise SystemExit(
                      f"{key}: variable-width family changed to {row['curve_family']}"
                  )
              if row["fit_safe"] != "1" or row["accepted"] != "1":
                  raise SystemExit(
                      f"{key}: variable-width sweep is no longer production-accepted"
                  )
              if int(row["curvature_flips"]) != 0:
                  raise SystemExit(f"{key}: variable-width sweep gained curvature flips")
              if float(row["max_deviation"]) > 2.05:
                  raise SystemExit(
                      f"{key}: variable-width source deviation regressed to {row['max_deviation']} px"
                  )
              if row["variable_width_profile_applied"] != "1":
                  raise SystemExit(f"{key}: variable-width profile mapper no longer applied")

              source_cv = float(row["variable_width_source_cv"])
              mapped_cv = float(row["variable_width_mapped_cv"])
              if source_cv <= 0 or mapped_cv < source_cv * 0.90 or mapped_cv > source_cv * 1.05:
                  raise SystemExit(
                      f"{key}: variable-width CV transfer regressed source={source_cv}, mapped={mapped_cv}"
                  )
              if float(row["variable_width_max_adjacent_delta"]) > 0.20:
                  raise SystemExit(
                      f"{key}: variable-width local breathing regressed to "
                      f"{row['variable_width_max_adjacent_delta']} px"
                  )

          # Production evidence: the gated layered-band redraw must actually run inside the
          # normal CurveFill path for both mirrored long S sweeps, not only in the preview run.
          import json

          report = json.loads(
              Path("artifacts/rugscale-c069/curve-suite-report.json").read_text(encoding="utf-8")
          )
          design = next(
              (entry for entry in report["designs"] if entry["name"] == "C069A_CREAM_N69"),
              None,
          )
          if design is None:
              raise SystemExit("C069 design row missing from curve-suite-report.json")
          layered_applied = int(design["toolLayeredRibbonApplied"])
          layered_candidates = int(design["toolLayeredRibbonCandidates"])
          if layered_applied < 2:
              raise SystemExit(
                  f"production layered-band redraw applied to {layered_applied} regions "
                  f"({layered_candidates} authorized); expected both mirrored long S sweeps"
              )
          if layered_applied > 2:
              raise SystemExit(
                  f"production layered-band redraw widened to {layered_applied} regions; "
                  "the strict long-S gate must not leak to other ribbons"
              )
          PY

      - name: Publish C069 summary
        if: always()
        shell: bash
        run: |
          if [ -f ./artifacts/rugscale-c069/curve-suite-report.md ]; then
            cat ./artifacts/rugscale-c069/curve-suite-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload C069 curve outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rugscale-c069-curve-training
          path: ./artifacts/rugscale-c069
          if-no-files-found: warn
          retention-days: 7
